<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>레드 · 세계편</title><link rel="stylesheet" href="style.css?v=3"></head>
<body>
<main id="game">
  <nav class="topline"><b id="timer">한국 · 0초</b><button id="speedBtn">1배속<small></small></button><button id="stagesBtn">스테이지 선택</button><button id="pauseBtn">일시정지</button></nav>
  <header class="hud"><div id="enemyHp">1000</div><div id="money">0원</div><div id="allyHp">2000</div></header>
  <section id="field" aria-label="한국 전장"><div id="enemyBase" class="base enemy"><b>적 성</b><span></span></div><div id="units"></div><div id="battleNotice" class="hidden" role="status"></div><div id="allyBase" class="base ally"><b>아군 성</b><span></span></div></section>
  <footer class="controls"><button id="incomeBtn" class="upgrade-btn">수입 업그레이드<br><small>100원</small></button><button id="spawnBtn" class="unit-btn"><i></i><strong>레드</strong><small>30원</small><em></em></button><button id="orangeBtn" class="unit-btn orange-btn"><i></i><strong>오렌지</strong><small>중국 클리어 시 해금</small><em></em></button><button id="yellowBtn" class="unit-btn yellow-btn"><i></i><strong>옐로우</strong><small>필리핀 클리어 시 해금</small><em></em></button><button id="greenBtn" class="unit-btn green-btn"><i></i><strong>그린</strong><small>일본 클리어 시 해금</small><em></em></button><button id="cyanBtn" class="unit-btn cyan-btn"><i></i><strong>시안</strong><small>클리어로 해금</small><em></em></button><button id="blueBtn" class="unit-btn blue-btn"><i></i><strong>블루</strong><small>클리어로 해금</small><em></em></button><button id="purpleBtn" class="unit-btn purple-btn"><i></i><strong>퍼플</strong><small>클리어로 해금</small><em></em></button><button id="pinkBtn" class="unit-btn pink-btn"><i></i><strong>핑크</strong><small>브라질 클리어 시 해금</small><em></em></button></footer>
  <div id="tutorial" class="overlay"><div id="shade"></div><div class="speech"><small>첫 전투 가이드</small><p id="tutorialText"></p><button id="skipBtn">건너뛰기</button> <button id="nextBtn">다음</button></div></div>
  <div id="pauseNotice" class="hidden">일시정지 중</div>
  <div id="result" class="overlay hidden"><div class="result-card"><h1 id="resultTitle"></h1><p id="resultDetail"></p><button id="nextStageBtn">다음 스테이지</button> <button id="restartBtn">다시하기</button> <button id="resultStagesBtn">스테이지 선택</button></div></div>
<section id="stageMenu" class="overlay hidden"><div class="stage-panel"><div class="stage-heading"><div><small>WORLD CHAPTER</small><h1>세계편</h1><p id="progressText"></p></div><button id="resumeBtn">전투로 돌아가기</button></div><p class="stage-intro">한국에서 달까지.</p><section class="training"><h2>기지 강화</h2><p>같은 XP로 아군 성 체력을 최대 Lv.10까지 강화합니다. 레벨당 체력 +10%.</p><div id="baseGrid"></div></section><section class="training"><h2>캐릭터 강화 <small id="xpText"></small></h2><p>클리어 보상 XP로 최대 Lv.10까지. 레벨당 체력·공격력 +10%.</p><p id="deckText"></p><div id="trainingGrid"></div><p id="saveWarning" role="status"></p></section><div id="stageGrid"></div><p class="stage-note">스테이지 순서는 냥코 세계편 기준입니다. 적 종류는 세계편 1장 지역별 구성을 참고합니다. 출현 시간·보스 조건·전투 수치는 프로토타입 전용입니다. 진행도는 이 브라우저에 저장됩니다.</p></div></section>
</main><script src="game.js?v=3"></script>
</body></html>
