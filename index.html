<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>한국 튜토리얼</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="tutorial-fix.css"></head>
<body>
<main id="game">
  <header class="hud"><div id="enemyHp">적 성 1000 / 1000</div><div id="money">100 / 1000원</div><div id="income">수입 Lv.1 · 초당 20원</div><div id="allyHp">아군 성 2000 / 2000</div></header>
  <section id="field" aria-label="한국 전장"><div id="enemyBase" class="base enemy"><b>적 성</b><span></span></div><div id="units"></div><div id="allyBase" class="base ally"><b>아군 성</b><span></span></div></section>
  <footer class="controls"><button id="spawnBtn" class="unit-btn"><i></i><strong>레드 동그라미</strong><small>50원 · 출격</small><em></em></button><button id="incomeBtn" class="upgrade-btn">수입 업그레이드<br><small>100원</small></button></footer>
  <div id="tutorial" class="overlay"><div id="shade"></div><div class="speech"><p id="tutorialText"></p><button id="nextBtn">다음</button></div></div>
  <div id="result" class="overlay hidden"><div class="result-card"><h1 id="resultTitle"></h1><button id="restartBtn">다시하기</button></div></div>
</main><script src="game.js"></script>
</body></html>
